[package]
name = "cranix-store"
description = "Local store, path registration, reference scanning and the derivation builder"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cranix-core.workspace = true
libc.workspace = true
zstd = "0.13"
xz2 = "0.1"
bzip2 = { version = "0.4", features = ["static"] }
# Builds the bundled liblzma so the binary does not depend on a system one.
lzma-sys = { version = "0.1", features = ["static"] }
serde_json.workspace = true
sha2.workspace = true
