[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LGPL-2.1-or-later"
rust-version = "1.83"

[workspace.dependencies]
cranix-core = { path = "crates/cranix-core" }
cranix-store = { path = "crates/cranix-store" }
cranix-eval = { path = "crates/cranix-eval" }
cranix-daemon = { path = "crates/cranix-daemon" }
cranix-fetchers = { path = "crates/cranix-fetchers" }
cranix-sbom = { path = "crates/cranix-sbom" }
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
regex = "1"
serde_json = "1"
libc = "0.2"
mimalloc = { version = "0.1", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
