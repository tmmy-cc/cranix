[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LGPL-2.1-or-later"
rust-version = "1.83"

[workspace.dependencies]
oxnix-core = { path = "crates/oxnix-core" }
oxnix-store = { path = "crates/oxnix-store" }
oxnix-eval = { path = "crates/oxnix-eval" }
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
regex = "1"
serde_json = "1"
libc = "0.2"
mimalloc = { version = "0.1", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
